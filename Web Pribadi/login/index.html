<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Akun</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="alertBox"></div>
    
    <div class="login-card" style="max-width: 350px; margin: 80px auto; padding: 20px; border: 1px solid #cbd5e1; border-radius: 8px;">
        <h2 style="text-align: center; border: none; padding: 0;">Masuk Aplikasi</h2>
        
        <form id="loginForm" onsubmit="event.preventDefault(); loginProses();">
            <div style="margin-bottom: 12px;">
                <label>Username:</label>
                <input type="text" id="username" required style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label>Password:</label>
                <input type="password" id="password" required style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 10px; background: #2b6cb0; color: white; border: none; border-radius: 4px; cursor: pointer;">MASUK</button>
        </form>
        
        <p style="margin-top: 15px; text-align: center; font-size: 9pt;">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
        <p style="text-align: center; font-size: 9pt;"><a href="../index.html">← Kembali ke Beranda</a></p>
        
        <div id="message"></div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
